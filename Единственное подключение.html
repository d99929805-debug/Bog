<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Единственное подключение</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Playfair+Display:wght@800&display=swap">
<style>
:root {
  --bg: #000000;
  --fg: #ffffff;
  --muted: #b9b9b9;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #000000; --fg: #ffffff; --muted: #b9b9b9; }
}
:root[data-theme="dark"] { --bg: #000000; --fg: #ffffff; --muted: #b9b9b9; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  box-sizing: border-box;
}
main { max-width: 22rem; }
p {
  margin: 0;
  font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: clamp(2rem, 9.5vw, 2.9rem);
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: 0.01em;
  color: var(--muted);
}
strong {
  display: block;
  margin-top: 0.2em;
  font-family: "Playfair Display", Georgia, "Times New Roman", serif;
  font-size: clamp(3.8rem, 23vw, 6.4rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.06em;
  color: var(--fg);
}
</style>
</head>
<body>
<main>
  <p>Единственное подключение, которое тебе нужно&nbsp;—&nbsp;это</p>
  <strong>БОГ</strong>
</main>
</body>
</html>
